<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamDex</title>
    <style>
      /* Schermata di caricamento: si vede finché l'app non è pronta (src/main.tsx la toglie) */
      html { background: #101219; color-scheme: dark; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 28px;
        background: #101219; color: #f2f4ff; font: 500 15px system-ui, sans-serif; transition: opacity 0.25s ease-out; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .boot-logo svg { display: block; width: min(320px, 70vw); height: auto; }
      #boot .boot-eevee { width: min(220px, 50vw); }
      #boot .boot-eevee svg { display: block; width: 100%; height: auto; transform-origin: 50% 100%; animation: boot-breathe 2.6s ease-in-out infinite; }
      /* Il simbolo gira a scatti (un giro, una pausa) come una Poké Ball che dondola: la scritta resta ferma */
      #boot .boot-mark { transform-box: view-box; transform-origin: 62px 60px; animation: boot-spin 1.5s cubic-bezier(0.65, 0, 0.3, 1) infinite; }
      #boot .boot-text { margin: 0; color: #aeb3cc; letter-spacing: 0.02em; }
      #boot.failed .boot-eevee svg, #boot.failed .boot-mark { animation: none; }
      @keyframes boot-spin { 0% { transform: rotate(0); } 60%, 100% { transform: rotate(360deg); } }
      @keyframes boot-breathe { 50% { transform: scale(1.015, 1.045); } }
      @media (prefers-reduced-motion: reduce) { #boot, #boot .boot-eevee svg, #boot .boot-mark { transition: none; animation: none; } }
    </style>
